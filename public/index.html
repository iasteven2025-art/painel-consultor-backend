<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Consultor - API</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #4ade80;
      margin-bottom: 1rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status"><span class="dot"></span>Online</div>
    <h1>Painel Consultor &mdash; API</h1>
    <p>O servico esta em execucao e pronto para receber requisicoes.</p>
  </div>
</body>
</html>
