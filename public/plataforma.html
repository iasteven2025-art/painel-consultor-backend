<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma — Painel do Consultor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul-900:#0A2733; --azul-800:#0E3A4C; --azul-700:#155166;
  --dourado:#B8923E; --dourado-light:#D4AF6A; --dourado-dim:#EFE2C4;
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-sunken:#FBFAF6;
  --text:#1B2A2E; --text-muted:#647178;
  --border:#E5E1D6; --border-strong:#D6D1C2;
  --success:#2E7D5B; --success-bg:#E5F3EC;
  --danger:#B84040; --danger-bg:#FAE9E9;
  --warning:#B8791E; --warning-bg:#FBF0DC;
  --radius:10px; --radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;color:var(--azul-900);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 12px 32px rgba(14,58,76,0.16);padding:40px;width:100%;max-width:380px;}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.login-brand-mark{width:38px;height:38px;border-radius:9px;background:var(--azul-900);display:flex;align-items:center;justify-content:center;color:var(--dourado-light);font-family:'Source Serif 4',serif;font-weight:700;font-size:17px;}
.login-brand-text{font-family:'Source Serif 4',serif;font-weight:600;font-size:17px;color:var(--azul-900);}
.login-brand-sub{font-size:12px;color:var(--text-muted);margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;}
.field input:focus{outline:none;border-color:var(--azul-700);box-shadow:0 0 0 3px rgba(29,107,132,0.12);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid transparent;width:100%;}
.btn-primary{background:var(--azul-900);color:#fff;}
.btn-primary:hover{background:var(--azul-700);}
.btn-gold{background:var(--dourado);color:var(--azul-900);}
.btn-gold:hover{background:var(--dourado-light);}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong);width:auto;}
.btn-danger-ghost{background:transparent;color:var(--danger);border:none;width:auto;padding:6px 10px;}
.btn-sm{padding:7px 12px;font-size:12.5px;width:auto;}
.login-error{background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;}

#app-shell{display:none;min-height:100vh;}
#sidebar{width:240px;background:linear-gradient(180deg,var(--azul-900),var(--azul-800));color:#EAF1F3;padding:20px 14px;}
.sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;color:rgba(234,241,243,0.82);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:rgba(212,175,106,0.14);color:var(--dourado-light);}
#main{flex:1;}
#topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
#content{padding:28px;max-width:1000px;}
.page-title{font-size:22px;margin-bottom:4px;}
.page-subtitle{color:var(--text-muted);font-size:13px;margin-bottom:20px;}
.page-header-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px;}
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-neutral{background:var(--surface-sunken);color:var(--text-muted);border:1px solid var(--border-strong);}
.badge-gold{background:var(--dourado-dim);color:var(--azul-900);}
.row-actions{display:flex;gap:6px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,39,51,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
.form-field input,.form-field select{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:8px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--azul-900);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:200;}
.toast.success{background:var(--success);}
.toast.danger{background:var(--danger);}
.divider{border-top:1px solid var(--border);margin:16px 0;padding-top:16px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">P</div>
      <div class="login-brand-text">Acesso Plataforma</div>
    </div>
    <div class="login-brand-sub">Área restrita — administração do sistema como um todo, não do seu grupo.</div>
    <div class="login-error" id="login-error"></div>
    <div class="field"><label>E-mail</label><input id="login-email" type="email"></div>
    <div class="field"><label>Senha</label><input id="login-senha" type="password"></div>
    <button class="btn btn-primary" id="login-btn" onclick="fazerLogin()">Entrar</button>
    <div style="text-align:center;margin-top:16px"><a href="/" style="font-size:12.5px;color:var(--text-muted)">← Voltar para o login normal</a></div>
  </div>
</div>

<div id="app-shell">
  <div id="sidebar">
    <div class="sidebar-brand">
      <div class="login-brand-mark">P</div>
      <div style="font-family:'Source Serif 4',serif;font-weight:600;color:#fff;font-size:15px">Plataforma</div>
    </div>
    <nav id="sidebar-nav"></nav>
  </div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content"></div>
  </div>
</div>

<script src="plataforma.js"></script>
</body>
</html>
